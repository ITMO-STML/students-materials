output_dir: ${hydra:runtime.output_dir}
learning_rate: 1.0e-5
num_train_epochs: 10
per_device_train_batch_size: ${data.batch_size}
per_device_eval_batch_size: ${data.batch_size}
dataloader_num_workers: ${data.num_workers}
dataloader_pin_memory: ${data.pin_memory}
bf16: true
lr_scheduler_type: cosine
warmup_steps: 0.1
logging_strategy: steps
logging_steps: 500
eval_strategy: steps
eval_steps: ${.logging_steps}
save_strategy: steps
save_steps: ${.logging_steps}
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eer
greater_is_better: false
remove_unused_columns: false
report_to:
  - trackio
  - codecarbon
project: wav2vec2-steering
